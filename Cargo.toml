[package]
name = "fastmd"
version = "0.2.0"
edition = "2024"
description = "Fast Markdown viewer with AI agent capabilities"
license = "MIT"
repository = "https://github.com/MartinKuhne/personal-productivity-ai/"
categories = ["text-editors"]
keywords = ["markdown", "viewer", "ai", "agent"]

[workspace]
members = [
    ".",
    "src/agent",
    "src/fastmd-tool-macros",
    "src/md2pdf",
]

[lib]
path = "src/app/lib.rs"

[features]
default = []

# Vector search (via qdrant)
vector-search = [
    "dep:async-openai",
    "dep:qdrant-client",
    "dep:text-splitter",
    "fastmd-agent/vector-search",
]

# Discord bot integration. UNTESTED.
discord = ["dep:futures-util", "dep:tokio-tungstenite"]

# Browser-automation. UNTESTED
browser = ["dep:playwright-rs", "fastmd-agent/browser"]

# Image library. UNFINISHED/UNTESTED
image-library = []

[dependencies]
anyhow = "1.0.104"
thiserror = "2"
mimalloc = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# UI framework migration (TASK-003, `doc/planning/iced.md`): iced ships as a
# REGULAR (non-optional) dependency per DEC-011 — no feature flag exists.
# The `markdown` feature gates iced's built-in Markdown widget
# (`iced-0.14.0/Cargo.toml:93` `markdown = ["iced_widget/markdown"]`,
# `iced_widget-0.14.2/Cargo.toml:51` `markdown = ["dep:pulldown-cmark"]`).
# The agent transcript renders assistant output through it ([TASK-018]).
iced = { version = "0.14.0", features = [
    "wgpu",
    "tiny-skia",
    "fira-sans",
    "advanced-shaping",
    "markdown",
] }
# `cosmic-text` and `iced_graphics` are DIRECT dependencies so the text
# measurer can shape strings with the same Fira Sans bytes iced paints with
# (`iced_graphics::text::FIRA_SANS_REGULAR`) instead of the flat
# character-count heuristic ([GAP-06], `src/app/ui_iced/table_width.rs`).
# Both are ALREADY in the dependency graph through `iced`
# (`iced` -> `iced_renderer` -> `iced_graphics` -> `cosmic-text` 0.15, and
# `iced_graphics` requests `cosmic-text` with its default features), so
# naming them here pulls in no additional compilation — it only makes the
# two items reachable by path. `fira-sans` on `iced_graphics` is the
# `cfg` gate for the `FIRA_SANS_REGULAR` const and mirrors the feature
# already enabled on `iced` above.
cosmic-text = "0.15.0"
iced_graphics = { version = "0.14.0", features = ["fira-sans"] }
notify = "8"
playwright-rs = { version = "0.15.1", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
futures-util = { version = "0.3", optional = true }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }

# `ring` is already a transitive dep through `rustls` (ring crypto
# provider). We depend on it directly for the OAuth 2.1 flow
# (PKCE SHA256 + CSPRNG for verifier/state).
ring = "0.17"
walkdir = "2.4"
glob = "0.3"
# `rustls` (not the default `default-tls` / native-tls) matches the
# rest of the crate: `jmap-client` uses rustls, and we depend on
# `rustls` directly for OAuth 2.1. Picking rustls everywhere keeps a
# single TLS stack in the binary.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
opener = { version = "0.8", features = ["reveal"] }
webbrowser = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
html-escape = "0.2"
tempfile = "3.8"
# `rfd` — Rusty File Dialogs. Used by "Save as PDF..."
rfd = "0.17"
fastmd-pdf = { path = "src/md2pdf" }
arc-swap = "1.9.2"
async-openai = { version = "0.41", optional = true, default-features = false, features = ["rustls", "embedding"] }
text-splitter = { version = "0.32", optional = true }
fastmd-agent = { path = "src/agent" }
qdrant-client = { version = "1.13", optional = true }
arboard = { version = "3.6.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target."cfg(not(windows))".dependencies]
trash = "5.2.6"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
filetime = "0.2"
proptest = "1.4"
rayon = "1.10"
# `criterion` is the project-wide micro-benchmark harness.
criterion = { version = "0.5", features = ["html_reports"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
wiremock = "0.6"
typst-syntax = "0.15"
# `iced_test` — headless iced interface driver ([TASK-025], DEC-011).
# Tests widgets and whole applications without opening a window
# (`doc/iced.md` "iced_test"). Used by the tier-2 simulator tests in
# `src/app/ui_iced/interaction_tests.rs`.
iced_test = "0.14.0"

[[bin]]
name = "fastmd"
path = "src/app/main.rs"

[[bin]]
name = "deploy"
path = "src/app/bin/deploy.rs"

[[bench]]
name = "table_width"
path = "benches/table_width.rs"
harness = false

[[bench]]
name = "commonmark_bisect"
path = "benches/commonmark_bisect.rs"
