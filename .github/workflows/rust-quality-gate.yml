name: Rust Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "src/desktop/**"
      - ".github/workflows/rust-quality-gate.yml"
  pull_request:
    paths:
      - "src/desktop/**"
      - ".github/workflows/rust-quality-gate.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo test
      # Tier 3 visual regression gate. `egui_kittest`'s snapshot
      # feature writes `{name}.new.png` next to each saved
      # `{name}.png` when the rendered output differs. Failing
      # the build on any `.new.png` is the egui_kittest equivalent
      # of `cargo insta pending-snapshots`. Reviewers can
      # inspect the diff locally and commit the new PNG to accept
      # intentional changes. See Q3 in
      # `doc/planning/egui-testing.md` for the policy.
      - name: Fail on pending snapshot diffs
        shell: bash
        run: |
          if compgen -G "tests/snapshots/*.new.png" > /dev/null; then
            echo "Error: pending snapshot diffs detected:"
            ls -la tests/snapshots/*.new.png
            echo ""
            echo "Inspect the diffs locally and either accept the new"
            echo "PNG (rename .new.png to .png) or fix the regression."
            exit 1
          fi

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo clippy -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo doc --no-deps --quiet
