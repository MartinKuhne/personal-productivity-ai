name: Rust Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "src/desktop/**"
      - ".github/workflows/rust-quality-gate.yml"
  pull_request:
    paths:
      - "src/desktop/**"
      - ".github/workflows/rust-quality-gate.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo test

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo clippy -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: src/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo doc --no-deps --quiet
