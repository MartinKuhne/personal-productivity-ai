name: Coverage Gate

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Override repo-level .cargo/config.toml `target-cpu=native` for portable CI VM execution
  RUSTFLAGS: ""

permissions:
  contents: read
  actions: write

jobs:
  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version ^0.8
      - name: Run coverage (llvm-cov)
        run: |
          # Product-code scope. Dev/lint harnesses are tooling rather than shipped
          # behaviour: the token lint gate, the mock JMAP server and the test harnesses.
          # Counting them would let scaffolding move the gate in either direction.
          IGNORE='src/app/main\.rs|src/app/bin/.*|src/agent/target/.*|tests/.*|benches/.*'
          IGNORE="$IGNORE|src/agent/lib/mcp/oauth/test_support\.rs|src/agent/tools/jmap/mock_server\.rs"
          IGNORE="$IGNORE|src/app/ui_iced/(test_helpers|token_lint_gate)(\.rs|_tests\.rs)"
          cargo llvm-cov --workspace --all-features --summary-only \
            --ignore-filename-regex "$IGNORE" \
            2>&1 | tee cov-summary.txt
          cat cov-summary.txt

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: cov-summary.txt
