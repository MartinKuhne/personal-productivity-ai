name: FastMD CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - ".config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - ".config/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  # Override repo-level .cargo/config.toml `target-cpu=native` for portable CI VM execution
  RUSTFLAGS: ""

permissions:
  contents: read

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo check --workspace --all-features

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # Install cargo-nextest at the same version the project ships in
      # `.config/nextest.toml`. The repo config is the source
      # of truth; pinning the version here ensures CI matches local runs.
      - run: cargo install cargo-nextest --locked --version ^0.9
      - name: Install Vulkan software renderer (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      # Use the `ci` profile (no retries, fail-fast, JUnit output) defined
      # in `.config/nextest.toml`. Local devs use the default
      # profile (2 retries, top-failures summary).
      - run: cargo nextest run --workspace --all-features --profile ci
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
      # Tier 3 visual regression gate. `egui_kittest`'s snapshot
      # feature writes `{name}.new.png` next to each saved
      # `{name}.png` when the rendered output differs. Failing
      # the build on any `.new.png` is the egui_kittest equivalent
      # of `cargo insta pending-snapshots`. Reviewers can
      # inspect the diff locally and commit the new PNG to accept
      # intentional changes. See Q3 in
      # `doc/planning/egui-testing.md` for the policy.
      - name: Fail on pending snapshot diffs
        shell: bash
        run: |
          if compgen -G "tests/snapshots/*.new.png" > /dev/null; then
            echo "Error: pending snapshot diffs detected:"
            ls -la tests/snapshots/*.new.png
            echo ""
            echo "Inspect the diffs locally and either accept the new"
            echo "PNG (rename .new.png to .png) or fix the regression."
            exit 1
          fi

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo clippy --workspace --all-features -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo doc --workspace --all-features --no-deps --quiet

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version ^0.8
      - name: Run coverage (llvm-cov)
        run: |
          cargo llvm-cov --workspace --all-features --summary-only \
            --ignore-filename-regex "src/app/main\\.rs|src/app/bin/.*|src/agent/lib/mcp/oauth/test_support\\.rs|src/agent/target/.*|tests/.*|benches/.*" \
            2>&1 | tee cov-summary.txt
          cat cov-summary.txt
      - name: Enforce coverage thresholds
        shell: bash
        run: |
          python3 - << 'PY'
          import re, sys, pathlib
          txt = pathlib.Path("cov-summary.txt").read_text(encoding="utf-8", errors="ignore")
          # TOTAL line
          m = re.search(r"TOTAL\s+(\d+)\s+(\d+)\s+([\d\.]+)%", txt)
          if not m:
              print("ERROR: TOTAL line not found in cov-summary.txt")
              sys.exit(1)
          total, missed, pct = int(m.group(1)), int(m.group(2)), float(m.group(3))
          print(f"TOTAL line coverage: {pct:.2f}% ({total-missed}/{total})")
          # Phase 0 baseline 83.61% (2026-08-27). Gate ratchets: 83% now → 85% after Phase 1 → 88% after Phase 3
          if pct < 83.0:
              print(f"FAIL: line coverage {pct:.2f}% < 83.00% gate (Phase 0 baseline)")
              print("  Ratchet to 85% after Phase 1, 88% after Phase 3 per doc/planning/close-test-gaps.md")
              sys.exit(1)
          # Per-file gate 60% (excluding allow-list already ignored + tiny shims)
          # Parse per-file lines: "<file>  <total> <missed> <line%> <func> ..."
          per_file = re.findall(r"^\s*(.+?)\s+(\d+)\s+(\d+)\s+([\d\.]+)%\s+(\d+)\s+(\d+)\s+([\d\.]+)%", txt, re.MULTILINE)
          violations = []
          for f, tot, miss, line_pct, *_ in per_file:
              f = f.strip()
              if f in ("TOTAL", "Filename", "Regions", "Executed"): continue
              if f.startswith("TOTAL"): continue
              # Skip excluded patterns already, but double-guard
              if any(x in f for x in ["test_support", "app\\main", "app/bin", "src/agent/target"]):
                  continue
              try:
                  lp = float(line_pct)
                  tot_i = int(tot)
              except: continue
              # Ignore trivial shims <10 lines (re-export mods) — documented non-issues
              if tot_i < 10: continue
              if lp < 60.0:
                  violations.append((f, lp, miss, tot))
          if violations:
              # Phase 0: warn-only (informational). Enforce hard fail after Phase 3 when builtin gaps closed.
              print(f"WARN: {len(violations)} files <60% line (Phase 0 informational, enforce after Phase 3):")
              for f, lp, miss, tot in sorted(violations, key=lambda x: x[1])[:20]:
                  print(f"  {lp:5.2f}%  {miss:4}/{tot:4}  {f}")
              if len(violations) > 30:
                  print("FAIL: >30 files <60% exceeds Phase 0 ceiling")
                  sys.exit(1)
          else:
              print("Per-file gate >=60%: pass")
          # Macro crate func gate 50% — parse fastmd-tool-macros line
          m2 = re.search(r"fastmd-tool-macros.*?\s+(\d+)\s+(\d+)\s+([\d\.]+)%\s+(\d+)\s+(\d+)\s+([\d\.]+)%", txt)
          if m2:
              func_pct = float(m2.group(6))
              print(f"fastmd-tool-macros func coverage: {func_pct:.2f}%")
              # Phase 0 baseline is 27%; gate is 50% after Phase 3 but warn now
              if func_pct < 27.0:
                  print(f"FAIL: fastmd-tool-macros func {func_pct:.2f}% regressed below baseline 27%")
                  sys.exit(1)
          print("Coverage gate: PASS")
          PY
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: cov-summary.txt
