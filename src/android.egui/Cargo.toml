[package]
name = "fastmd-android-egui"
version = "0.1.0"
edition = "2024"
description = "Rust + eframe (egui) port of the FastMD Android OneDrive viewer"
license = "MIT"
repository = "https://github.com/MartinKuhne/personal-productivity-ai/"
categories = ["gui", "mobile"]
keywords = ["android", "egui", "onedrive", "markdown", "oauth"]

# We need a cdylib for the Android activity entry point and an rlib for the
# host (cargo test, cargo apk running on a desktop preview, etc.).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Use the wgpu backend instead of glow on Android. glow is the eframe default
# and works on most devices; wgpu is preferred when targeting Vulkan-capable
# modern hardware and tends to have fewer driver surprises on emulators.
# Leave opt-in until we have a reason to flip it.
wgpu = []

[dependencies]
# --- UI ---
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "android-native-activity",
] }
egui = "0.35"
egui_extras = { version = "0.35", default-features = false }

# --- HTTP / JSON (Graph API) ---
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Crypto for OAuth 2.0 PKCE (SHA-256 + CSPRNG) ---
# Same dep rationale as src/desktop/Cargo.toml: ring is already a transitive
# dep through rustls; we depend on it directly for the OAuth flow.
ring = "0.17"
url = "2.5"
urlencoding = "2.1"
base64 = "0.22"

# --- Misc ---
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "android")'.dependencies]
# android_logger is the standard logcat bridge. eframe already pulls in `log`
# as a re-export, so we just need the bridge on Android.
android_logger = "0.14"
log = "0.4"
# We need winit's AndroidApp to pass into `eframe::run_native` and to stash
# in a `OnceLock` for the future deep-link poller. The version must match
# what eframe 0.35 uses (currently 0.30.x).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# JNI bindings for the OAuth round-trip (browser launch + deep-link poll).
# Pinned to 0.21 (the last release before jni's 0.22 split of `JNIEnv`
# into `Env`/`EnvUnowned`); 0.21 has the documented, idiomatic API
# (`JavaVM::attach_current_thread` -> `JNIEnv`, `&str` method
# signatures). jni 0.22 is also pulled in transitively via android-activity
# 0.6 but we use 0.21 in our own code.
jni = "0.21"
ndk-context = "0.1"

# Host build: open the authorize URL in the default browser for local
# cargo-test / desktop-preview runs. Pulled in only off-Android so we
# don't carry the desktop deps into the mobile binary.
[target.'cfg(not(target_os = "android"))'.dependencies]
webbrowser = "1"

[dev-dependencies]
tempfile = "3.8"

# ----------------------------------------------------------------------
# Android packaging (cargo-apk reads [package.metadata.android])
# ----------------------------------------------------------------------
#
# What cargo-apk 0.10 actually parses is intentionally narrow: package id,
# label, SDK levels, ABIs, and permissions. Activity metadata beyond the
# default `android.app.NativeActivity` with the `MAIN`/`LAUNCHER` intent
# filter is not supported via this metadata block; the cargo-apk output
# always uses `android.app.NativeActivity` with the standard launcher
# intent. If you need the `msauth://...` deep-link intent filter for the
# OAuth flow, you must build the APK, then unpack, edit AndroidManifest.xml,
# repack, and re-sign. (Until the JNI glue in `src/android.rs` is filled in
# anyway, since the deep-link handler doesn't exist yet.) See README.md.
[package.metadata.android]
min_sdk_version = 26
target_sdk_version = 34
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
package = "com.fastmd.android.egui"
label = "FastMD egui"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"
