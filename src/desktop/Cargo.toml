[package]
name = "fastmd"
version = "0.2.0"
edition = "2024"
description = "Fast Markdown viewer with AI agent capabilities"
license = "MIT"
repository = "https://github.com/MartinKuhne/personal-productivity-ai/"
categories = ["text-editors"]
keywords = ["markdown", "viewer", "ai", "agent"]

[features]
default = ["pdf-export"]
vector-search = [
    "dep:async-openai",
    "dep:qdrant-client",
    "dep:text-splitter",
    "fastmd-agent/vector-search",
]
# Discord bot integration. Adds the `integrations::discord` module and
# the `run_discord_bot` entry point. Off by default — the bot is not
# wired into `main.rs` and ships as opt-in.
discord = []
# Browser-automation + image-capture tooling (Playwright). Adds
# `app::browser`, the `BrowserSession` runtime in `app::session`, and
# the `browser_*` agent tools. Heavy dependency (~6 MB compiled
# output for the Playwright client + macros); off by default.
browser = ["dep:playwright-rs", "fastmd-agent/browser"]
# Image-library / image-vision worker. Adds the [`ImageJob`]
# type, the `ImageVisionWorker` background processor, the
# image-routing branch in the file-event bus router, and the
# `tx_img` worker channel. Off by default — the image-vision
# pipeline talks to a vision-capable LLM and the `LogCategory::ImageVision`
# log category stays compiled (so the UI filter chip still
# renders) but no worker ever emits into it.
image-library = []
# PDF export via `typst-as-lib` — adds the [`app::print_pdf`]
# module, the [`markdown::typst`] translator, and the
# "Save as PDF" right-click context-menu entry. Off by default
# — the Typst engine adds ~30 MB to the binary and a few
# minutes to compile time. The user can flip this on when they
# want print-quality PDF output.
pdf-export = [
    "dep:rfd",
    "dep:typst-as-lib",
    "dep:typst-layout",
    "dep:typst-pdf",
    "dep:typst",
    "dep:typst-kit"
]

[dependencies]
anyhow = "1.0.104"
thiserror = "2"
mimalloc = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22.1"
bytes = "1"
chrono = "0.4.45"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit", "persistence"] }
egui_extras = { version = "0.36", default-features = false }
fast-dav-rs = "0.4.4"
fast_h2m = "^0.4"
jmap-client = { version = "=0.4.1", default-features = false, features = ["blocking", "rustls"] }
notify = "8"
playwright-rs = { version = "0.15.1", optional = true }
pulldown-cmark = { version = "0.13", features = ["html"] }
rustls = { version = "0.23", features = ["ring"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "process"] }

# `ring` is already a transitive dep through `rustls` (ring crypto
# provider). We depend on it directly for the OAuth 2.1 flow
# (PKCE SHA256 + CSPRNG for verifier/state).
ring = "0.17"
walkdir = "2.4"
glob = "0.3"
# `rustls` (not the default `default-tls` / native-tls) matches the
# rest of the crate: `jmap-client` uses rustls, and we depend on
# `rustls` directly for OAuth 2.1. Picking rustls everywhere keeps a
# single TLS stack in the binary.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
opener = { version = "0.8", features = ["reveal"] }
webbrowser = "1"
backon = "1.6"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
csv = "1.4.0"
evalexpr = "13.1.0"
html-escape = "0.2"
url = "2.5"
quick-xml = "0.41.0"
encoding_rs = "0.8.35"
tempfile = "3.8"
tokio-tungstenite = { version = "0.30", features = ["rustls"] }
futures = "0.3"
# `rfd` — Rusty File Dialogs. Used by the "Save as PDF..."
# context-menu entry to show a native "Save as" dialog before
# writing the PDF (the user picks the destination, we don't
# silently save next to the source). Gated on the same
rfd = { version = "0.17", optional = true }
typst-as-lib = { version = "0.16", optional = true, features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-layout = { version = "0.15", optional = true }
typst-pdf = { version = "0.15", optional = true }
typst = { version = "0.15", optional = true }
typst-kit = { version = "0.15", optional = true }
arc-swap = "1.9.2"
# `async-openai` provides the OpenAI-compatible embeddings endpoint for the
# optional vector-search worker. The embedding model comes from the user's
# configured `embeddings` use-case model (AGENT-005). `rustls` keeps a single
# TLS stack with the rest of the crate; `embedding` enables the embeddings API.
async-openai = { version = "0.41", optional = true, default-features = false, features = ["rustls", "embedding"] }
text-splitter = { version = "0.32", optional = true }
# `fastmd-tool-macros` — sibling proc-macro crate that ships
# `#[derive(ToolDescriptor)]`. See `fastmd-tool-macros/src/lib.rs`
# for the macro contract. The repo has no Cargo workspace today
# (this crate is the only runtime crate), so the proc-macro is
# added as a path dep rather than going into a separate
# workspace member.
fastmd-tool-macros = { path = "fastmd-tool-macros" }
fastmd-agent = { path = "src/agent" }
qdrant-client = { version = "1.13", optional = true }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target."cfg(not(windows))".dependencies]
trash = "5.2.6"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
filetime = "0.2"
proptest = "1.4"
# `arbitrary` enables `#[derive(Arbitrary)]` on types we want to feed into
# `cargo-fuzz` targets. Currently unused in the source — Phase 5 of the
# fuzzing plan (`doc/planning/fuzzing.md`) is where the cargo-fuzz crate
# will pull this in. Adding it now means a future PR that adds the fuzz
# targets doesn't need to touch dev-deps at the same time.
arbitrary = { version = "1", features = ["derive"] }
# `rayon` is the data-parallelism library used by the
# per-example content-fidelity test
# (`all_commonmark_examples_render_content_into_pdf` in
# `tests/commonmark_spec_test.rs`). The test spawns work
# across a rayon thread pool (default = num_cpus threads)
# instead of one raw `std::thread` per example. This
# avoids the 608-thread / ~600MB-stack working set that
# the raw-thread approach hit, and uses work-stealing so
# the slowest examples don't pin a worker. Pin to the
# 1.10 line for the `par_iter` / `ThreadPool` APIs we
# rely on.
rayon = "1.10"
# `criterion` is the project-wide micro-benchmark harness. Run with
# `cargo bench` locally; the GH Actions bench workflow runs the same
# suite on a separate (informational, not gating) job. Pinned to
# the 0.5 line for the `--profile ci` + custom-criterion-config
# integration to stay stable.
criterion = { version = "0.5", features = ["html_reports"] }
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }
# `accesskit::Role` is the type used by `egui_kittest::Role` /
# `kittest::Queryable::get_by_role`; pull it in as a direct
# dev-dep so the tests can `use accesskit::Role` without having
# to reach through the harness's re-exports.
accesskit = "0.24"
# `log` is used directly by `egui` for its `WARN` output, and the
# panel-id-stability tests install a `log::Log` implementation
# to capture those records and assert they do not fire.
log = "0.4"
# `image` is used by `egui_kittest::snapshot` to load and diff the
# PNG snapshots. The `png` feature is required for the snapshot
# format. Snapshots are saved as PNGs in `src/desktop/tests/snapshots/`.
image = { version = "0.25", default-features = false, features = ["png"] }
# `wiremock` is the shared mock-HTTP-server library used by every
# integration test that needs to fake an external service (Trello,
# Weather, CalDAV, MCP OAuth). It is the only mock-server crate the
# crate uses; the previous ad-hoc `TcpListener` helpers in
# `integrations/*/tests*.rs` were removed in favour of this single
# dev-dep.
wiremock = "0.6"
pdf_oxide = "0.3.77"

[[bin]]
name = "fastmd"
path = "src/main.rs"

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"

[[bench]]
name = "table_width"
path = "benches/table_width.rs"
harness = false
