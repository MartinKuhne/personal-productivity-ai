[package]
name = "fastmd"
version = "1.2.0"
edition = "2024"
description = "Fast Markdown viewer with AI agent capabilities"
license = "MIT"
repository = "https://github.com/user/fastmd"
categories = ["command-line-utilities", "text-editors", "development-tools"]
keywords = ["markdown", "viewer", "ai", "agent"]

[dependencies]
anyhow = "1.0.104"
thiserror = "2"
mimalloc = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22.1"
bytes = "1"
chrono = "0.4.45"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
fast-dav-rs = "0.4.3"
fast_h2m = "*"
jmap-client = { version = "=0.4.1", default-features = false, features = ["blocking", "rustls"] }
notify = "6.0"
playwright-rs = "0.14.1"
pulldown-cmark = { version = "0.13", features = ["html"] }
rustls = { version = "0.23", features = ["ring"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.13"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync"] }
trash = "5.2.6"
ureq = { version = "2.9", features = ["json"] }
walkdir = "2.4"
glob = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
opener = { version = "0.7", features = ["reveal"] }
webbrowser = "1"
backoff = { version = "0.4", features = ["tokio"] }
gray_matter = "0.3"
csv = "1.4.0"
evalexpr = "13.1.0"
html-escape = "0.2"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
filetime = "0.2"
proptest = "1.4"
egui_kittest = { version = "0.35", features = ["eframe", "snapshot"] }
# `accesskit::Role` is the type used by `egui_kittest::Role` /
# `kittest::Queryable::get_by_role`; pull it in as a direct
# dev-dep so the tests can `use accesskit::Role` without having
# to reach through the harness's re-exports.
accesskit = "0.24"
# `log` is used directly by `egui` for its `WARN` output, and the
# panel-id-stability tests install a `log::Log` implementation
# to capture those records and assert they do not fire.
log = "0.4"
# `image` is used by `egui_kittest::snapshot` to load and diff the
# PNG snapshots. The `png` feature is required for the snapshot
# format. Snapshots are saved as PNGs in `src/desktop/tests/snapshots/`.
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "fastmd"
path = "src/main.rs"

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"

