[package]
name = "fastmd"
version = "0.2.0"
edition = "2024"
description = "Fast Markdown viewer with AI agent capabilities"
license = "MIT"
repository = "https://github.com/MartinKuhne/personal-productivity-ai/"
categories = ["text-editors"]
keywords = ["markdown", "viewer", "ai", "agent"]

[features]
default = []
# Discord bot integration. Adds the `integrations::discord` module and
# the `run_discord_bot` entry point. Off by default — the bot is not
# wired into `main.rs` and ships as opt-in.
discord = []
# Browser-automation + image-capture tooling (Playwright). Adds
# `app::browser`, the `BrowserSession` runtime in `app::session`, and
# the `browser_*` agent tools. Heavy dependency (~6 MB compiled
# output for the Playwright client + macros); off by default.
browser = ["dep:playwright-rs"]
# Image-library / image-vision worker. Adds the [`ImageJob`]
# type, the `ImageVisionWorker` background processor, the
# image-routing branch in the file-event bus router, and the
# `tx_img` worker channel. Off by default — the image-vision
# pipeline talks to a vision-capable LLM and the `LogCategory::ImageVision`
# log category stays compiled (so the UI filter chip still
# renders) but no worker ever emits into it.
image-library = []

[dependencies]
anyhow = "1.0.104"
thiserror = "2"
mimalloc = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22.1"
bytes = "1"
chrono = "0.4.45"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence"] }
egui_extras = { version = "0.35", default-features = false }
fast-dav-rs = "0.4.4"
fast_h2m = "^0.4"
jmap-client = { version = "=0.4.1", default-features = false, features = ["blocking", "rustls"] }
notify = "6.0"
playwright-rs = { version = "0.14.1", optional = true }
pulldown-cmark = { version = "0.13", features = ["html"] }
rustls = { version = "0.23", features = ["ring"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "process"] }
trash = "5.2.6"
ureq = { version = "2.9", features = ["json"] }
# `ring` is already a transitive dep through `rustls` (ring crypto
# provider). We depend on it directly for the OAuth 2.1 flow
# (PKCE SHA256 + CSPRNG for verifier/state).
ring = "0.17"
walkdir = "2.4"
glob = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
opener = { version = "0.7", features = ["reveal"] }
webbrowser = "1"
backon = "1.6"
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1.4.0"
evalexpr = "13.1.0"
html-escape = "0.2"
url = "2.5"
quick-xml = "0.41.0"
encoding_rs = "0.8.35"
tempfile = "3.8"
tokio-tungstenite = { version = "0.23", features = ["rustls"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
filetime = "0.2"
proptest = "1.4"
egui_kittest = { version = "0.35", features = ["eframe", "snapshot"] }
# `accesskit::Role` is the type used by `egui_kittest::Role` /
# `kittest::Queryable::get_by_role`; pull it in as a direct
# dev-dep so the tests can `use accesskit::Role` without having
# to reach through the harness's re-exports.
accesskit = "0.24"
# `log` is used directly by `egui` for its `WARN` output, and the
# panel-id-stability tests install a `log::Log` implementation
# to capture those records and assert they do not fire.
log = "0.4"
# `image` is used by `egui_kittest::snapshot` to load and diff the
# PNG snapshots. The `png` feature is required for the snapshot
# format. Snapshots are saved as PNGs in `src/desktop/tests/snapshots/`.
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "fastmd"
path = "src/main.rs"

[[bin]]
name = "deploy"
path = "src/bin/deploy.rs"
