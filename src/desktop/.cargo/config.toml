[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[env]
# sahomedb bundles pyo3 (0.20.3) which rejects Python 3.13 at build time;
# building against the stable abi3 API sidesteps that. Build-time only.
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
