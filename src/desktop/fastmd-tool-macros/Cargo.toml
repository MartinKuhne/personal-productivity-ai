[package]
name = "fastmd-tool-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for the fastmd tool registry"
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
