[package]
name = "hoarfrost-demo"
version = "0.1.0"
edition = "2024"
description = "A standalone runnable showcase of the hoarfrost UI framework"
license = "MIT"
publish = false

# This crate is its OWN cargo workspace. Without the empty `[workspace]` table
# cargo walks up to `D:\ppai2\Cargo.toml` and tries to join the fastmd
# workspace, which this demo is deliberately not part of (PLAN C2).
[workspace]

[dependencies]
hoarfrost = { path = "../hoarfrost" }
# Feature set MUST match `hoarfrost`'s exactly (PLAN C3) or the re-exported
# iced types on the two sides of the boundary do not line up. See
# `src/hoarfrost/Cargo.toml`.
iced = { version = "0.14.0", features = [
    "wgpu",
    "tiny-skia",
    "fira-sans",
    "advanced-shaping",
    "advanced",
] }

[dev-dependencies]
iced_test = "0.14.0"
# Already in the lock graph; used only to keep font fixtures off real user
# paths (`RUST-006`).
tempfile = "3"
