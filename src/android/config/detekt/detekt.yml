# Detekt configuration for the FastMD Android module. Build upon the
# default config (we add our own exceptions below) and treat warnings as
# errors via the `-Ddetekt.parallel=true` + `--warning-mode fail` Gradle
# flags in the CI workflow.
build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
  ComplexCondition:
    threshold: 4

naming:
  ClassNaming:
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
  VariableNaming:
    variablePattern: '[a-z][A-Za-z0-9]*'
  PackageNaming:
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'

style:
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2', '100', '200', '301', '401', '404', '500', '1000', '1024']
    ignoreHashCodeFunction: true
  ReturnCount:
    max: 4
    excludedFunctions: ['equals', 'hashCode']
  UnusedPrivateMember:
    active: true
  UnusedImports:
    active: true
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames: ['Exception', 'RuntimeException', 'Throwable']
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
