<!-- Option 5 — Abstract F+M Ligature
     Single-shape mark: F's crossbar is a lightning zig-zag, tail forms D curve. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FM ligature bolt">
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#09090B"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#6366F1" stroke-opacity="0.35"/>
  <!-- monogram path: F stem + bolt crossbar + D bowl -->
  <path d="M10.2 7.2 H18.4 L15.6 12.6 H12.8 V15.4 H17.2 L14.2 20.8 H12.8 V24.9 H9.6 V7.2 Z
           M16.2 7.2 C20.8 7.2 24.2 10.1 24.2 15.9 C24.2 21.7 20.8 24.9 16.2 24.9 H13.5 V7.2 H16.2 Z
           M16.0 10.4 H16.6 V21.7 H16.0 C18.6 21.7 20.9 19.6 20.9 15.9 C20.9 12.2 18.6 10.4 16.0 10.4 Z"
        fill="white" opacity="0.92"/>
  <!-- bolt accent cutting through -->
  <path d="M17.8 4.8 L12.0 13.4 H14.5 L13.2 19.6 L19.5 10.2 H16.6 Z" fill="#64C8FF" stroke="white" stroke-width="0.3" stroke-linejoin="round"/>
</svg>
