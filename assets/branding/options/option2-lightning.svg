<!-- Option 2 — Evolved Lightning
     Custom bolt, sharper than Phosphor E2DE. Dual-stroke: indigo bg, cyan bolt.
     22° lean, 7-point polygon. Outer glow via stroke. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lightning bolt">
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#09090B"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#6366F1" stroke-opacity="0.35"/>
  <!-- bolt shadow -->
  <path d="M19.2 3.8 L9.2 16.6 H14.9 L13.2 28.5 L23.2 12.8 H16.6 Z"
        fill="none" stroke="#6366F1" stroke-width="1.2" stroke-linejoin="round" opacity="0.55"/>
  <!-- bolt fill -->
  <path d="M19.2 3.8 L9.2 16.6 H14.9 L13.2 28.5 L23.2 12.8 H16.6 Z"
        fill="#64C8FF" stroke="white" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- inner highlight -->
  <path d="M18.6 5.6 L11.2 15.4 H14.3 L14.0 22.2 L20.8 13.9 H16.8 Z" fill="white" opacity="0.22"/>
</svg>
